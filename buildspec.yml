version: 0.2
phases:
  install:
    runtime-versions:
      java: corretto21
  build:
    commands:
      - mvn clean package
     # Move the JAR file from target/ to the root directory
      - echo "Moving JAR file to root folder"
      - mv target/food-service-0.0.1-SNAPSHOT.jar .  # Moves the .jar file to the root directory of the build artifact

artifacts:
  files:
    - target/food-service-0.0.1-SNAPSHOT.jar
