version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo Installing Maven...
      - yum install -y maven

  pre_build:
    commands:
      - echo Cleaning project...
      - mvn clean

  build:
    commands:
      - echo Building project...
      - mvn package -DskipTests=true

  post_build:
    commands:
      - echo Preparing artifact...
      - mkdir -p target/deployment
      - cp target/*.jar target/deployment/application.jar
      - cd target/deployment
      - zip -r ../springboot-app.zip .
      - cd ../..

artifacts:
  files:
    - target/springboot-app.zip
