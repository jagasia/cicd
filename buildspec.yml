version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo Installing Maven...
      - yum install -y maven

  pre_build:
    commands:
      - echo Cleaning project...
      - mvn clean

  build:
    commands:
      - echo Building project...
      - mvn package -DskipTests=true

  post_build:
    commands:
      - echo Preparing deployment package...
      - mkdir deployment
      - cp target/*.jar deployment/application.jar
      - cp Procfile deployment/
      - cd deployment
      - zip ../springboot-app.zip application.jar Procfile
      - cd ..

artifacts:
  files:
    - springboot-app.zip
